name: kNow CD

on:
  workflow_run:
    workflows:
      - "kNow CI"
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::424822286690:role/know-github-actions
          aws-region: eu-north-1

      - name: Deploy to EC2 with Systems Manager
        env:
          INSTANCE_ID: i-06c2d0cc847c8debd
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          ECR_REGISTRY: 424822286690.dkr.ecr.eu-north-1.amazonaws.com
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"set -e\",
              \"cd /home/ubuntu/know-devops\",
              \"sudo -u ubuntu git -C /home/ubuntu/know-devops fetch origin main\",
              \"sudo -u ubuntu git -C /home/ubuntu/know-devops checkout --detach $IMAGE_TAG\",
              \"aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin $ECR_REGISTRY\",
              \"ECR_REGISTRY=$ECR_REGISTRY IMAGE_TAG=$IMAGE_TAG docker compose --env-file /home/ubuntu/.env.production -f docker-compose.prod.yml pull\",
              \"ECR_REGISTRY=$ECR_REGISTRY IMAGE_TAG=$IMAGE_TAG docker compose --env-file /home/ubuntu/.env.production -f docker-compose.prod.yml up -d\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"; then

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID"

            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"