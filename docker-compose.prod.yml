services:
  frontend:
    image: ${ECR_REGISTRY}/know-frontend:${IMAGE_TAG}
    container_name: know-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: ${ECR_REGISTRY}/know-backend:${IMAGE_TAG}
    container_name: know-backend
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    restart: unless-stopped

    logging:
      driver: awslogs
      options:
        awslogs-region: eu-north-1
        awslogs-group: /know/backend
        awslogs-stream: know-backend